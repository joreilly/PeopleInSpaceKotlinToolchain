product:
  type: kmp/lib
  platforms: [android, iosArm64, iosSimulatorArm64, jvm]

dependencies:
  - $compose.runtime
  - $compose.foundation
  - $compose.material3
  - $compose.ui
  - $compose.preview
  - $compose.hotReload.runtimeApi
  - $libs.androidx.lifecycle.viewmodel.compose
  - $libs.material3.adaptive.layout
  - $libs.material3.adaptive.navigation
  - $libs.material3.adaptive.navigation.suite
  - $libs.material.icons.core
  - $libs.navigationevent.compose
  - $libs.coil.compose
  - $libs.coil.network.ktor
  - $libs.ktor.client.core
  - $libs.ktor.client.content.negotiation
  - $libs.ktor.serialization.kotlinx.json
  - $kotlin.serialization.json
  - $libs.koin.core: exported
  - $libs.koin.compose.viewmodel
  - $libs.sqldelight.runtime
  - $libs.sqldelight.coroutines.extensions

dependencies@android:
  - $compose.uiTooling
  - $libs.ktor.client.okhttp
  - $libs.koin.android: exported
  - $libs.sqldelight.android.driver
  - $libs.osmdroid.android
  - $libs.osm.android.compose

dependencies@jvm:
  - $libs.ktor.client.okhttp
  - $libs.sqldelight.sqlite.driver

dependencies@ios:
  - $libs.ktor.client.darwin
  - $libs.sqldelight.native.driver

settings:
  kotlin:
    serialization: enabled
  compose:
    enabled: true

# Local plugin (plugins/sqldelight): generates the database from sqldelight/**/*.sq
plugins:
  sqldelight:
    enabled: true
    packageName: dev.johnoreilly.peopleinspace.db
    className: PeopleInSpaceDatabase
